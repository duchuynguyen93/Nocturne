name: Build

# Runner Windows tính gấp đôi phút, và repo này là private — nên mỗi lần đẩy
# tài liệu mà quay cả pipeline là tiêu tiền cho không gì cả.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs first and alone: Core and Engine are platform-neutral by design, so a
  # failure here is a real logic failure rather than a Windows toolchain problem.
  # Keeping it on Linux proves that neutrality has not quietly been lost.
  portable-tests:
    name: Portable tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Results go to the step summary rather than to an uploaded artifact.
      # Actions artifact storage is a small shared quota across the whole
      # account, and a .trx file nobody downloads is not worth spending it on.
      - name: Test
        run: dotnet test tests/Nocturne.Core.Tests/Nocturne.Core.Tests.csproj -c Release

  windows-build:
    name: Windows ${{ matrix.platform }}
    runs-on: windows-latest
    timeout-minutes: 40
    needs: portable-tests

    # Needed to publish the rolling build release.
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        platform: [x64]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Show toolchain
        shell: pwsh
        run: dotnet --info

      # libmpv from the shinchiro build, ANGLE from the MSYS2 angleproject
      # package. A non-zero exit means one of them is missing, and a build that
      # ships without either cannot draw a frame — so this is allowed to fail
      # the job rather than producing an installer that looks fine and is not.
      - name: Fetch native runtime
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-mpv.ps1 -Architecture ${{ matrix.platform }}

      - name: Restore
        shell: pwsh
        run: dotnet restore Nocturne.sln -p:Platform=${{ matrix.platform }}

      - name: Build
        shell: pwsh
        run: >-
          dotnet build Nocturne.sln -c Release
          -p:Platform=${{ matrix.platform }} --no-restore

      - name: Publish self-contained app
        shell: pwsh
        run: >-
          dotnet publish src/Nocturne.App/Nocturne.App.csproj
          -c Release
          -p:Platform=${{ matrix.platform }}
          -r win-${{ matrix.platform }}
          --self-contained true
          -p:InformationalVersion=${{ github.sha }}
          -o artifacts/publish/${{ matrix.platform }}

      # The publish output does not pick up native\ through the csproj glob when
      # RuntimeIdentifier changes the item evaluation order, so the copy is
      # repeated here where the final layout is known.
      - name: Stage native runtime beside the executable
        shell: pwsh
        run: |
          $source = "native/win-${{ matrix.platform }}"
          if (Test-Path $source) {
            Copy-Item "$source/*.dll" "artifacts/publish/${{ matrix.platform }}/" -Force
          }
          # A publish missing any of these builds and installs cleanly and then
          # cannot draw a frame. Checking here beats finding out on a user's
          # machine with a message about a missing DLL.
          # ANGLE's mingw runtime is listed here too. Omitting it produced a
          # build that installed cleanly and then failed to load libEGL with
          # ERROR_BAD_EXE_FORMAT, because Windows fell back to whatever
          # same-named library the machine happened to have on PATH.
          $required = @(
            'libmpv-2.dll', 'libEGL.dll', 'libGLESv2.dll',
            'libgcc_s_seh-1.dll', 'libstdc++-6.dll', 'libwinpthread-1.dll')
          $dest = "artifacts/publish/${{ matrix.platform }}"
          $absent = $required | Where-Object { -not (Test-Path (Join-Path $dest $_)) }
          if ($absent) { throw "Publish is missing: $($absent -join ', ')" }
          $required | ForEach-Object { Write-Host "native: $_" }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup 6 was not found at $iscc."
          }

          & $iscc /DAppPlatform=${{ matrix.platform }} installer\Nocturne.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited with $LASTEXITCODE." }

      # Published to a rolling prerelease rather than as Actions artifacts.
      # Release assets do not draw on the Actions artifact quota, they survive
      # the artifact retention window, and they give a stable download URL
      # instead of one buried in a run page.
      - name: Package portable build
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "artifacts/publish/${{ matrix.platform }}/*" `
            -DestinationPath "artifacts/nocturne-${{ matrix.platform }}-portable.zip" `
            -Force

      - name: Publish to the rolling build release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'build-latest'

          # Recreate rather than update: a stale asset from a previous run under
          # the same name is worse than no asset, because it looks current.
          gh release delete $tag --repo ${{ github.repository }} --yes --cleanup-tag 2>$null

          $notes = @"
          Automatic build of ``$env:GITHUB_SHA``.

          Bundles libmpv and ANGLE. Self-contained — no .NET install needed.
          "@

          gh release create $tag `
            --repo ${{ github.repository }} `
            --title "Latest build" `
            --notes "$notes" `
            --prerelease `
            "artifacts/installer/*.exe" `
            "artifacts/nocturne-${{ matrix.platform }}-portable.zip"

      # Deliberately the last step, and deliberately in this job rather than its
      # own. Formatting needs the WinUI toolchain, so a separate job means a
      # second Windows runner — billed at twice the rate of Linux — for a check
      # that has never once been the reason a build was wrong. Running it after
      # the release keeps the original property that a formatting nit cannot
      # stand between a change and a downloadable installer.
      - name: Verify formatting
        shell: pwsh
        run: dotnet format Nocturne.sln --verify-no-changes --severity error
